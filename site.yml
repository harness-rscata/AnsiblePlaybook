---
# site.yml
#
# Configures a target host (e.g. the GCP instance created by main.tf) to:
#   1. Allow SSH password authentication (in addition to key-based auth)
#   2. Create a local "lab" user with a password
#   3. Drop a sample/decoy file that simulates a credentials dump
#
# Intended for lab, demo, or honeypot-style use on a disposable instance —
# not a hardening playbook. Password SSH auth on an internet-facing box is
# inherently weak; only do this on something you're intentionally exposing.

- name: Configure SSH password auth and sample decoy file
  hosts: all
  become: true
  vars:
    lab_user: "labuser"
    lab_password: "ChangeMe123!"     # sample only — override in group_vars/vault
    decoy_dir: "/opt/backup"
    decoy_file: "passwords.txt"

  tasks:
    - name: Update apt cache (Debian/Ubuntu)
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"

    - name: Ensure the lab user exists
      ansible.builtin.user:
        name: "{{ lab_user }}"
        password: "{{ lab_password | password_hash('sha512') }}"
        shell: /bin/bash
        create_home: true
        update_password: always

    - name: Enable password authentication in sshd_config
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?\s*PasswordAuthentication'
        line: "PasswordAuthentication yes"
        backup: true
      notify: Restart sshd

    - name: Ensure PAM-based auth is enabled (some cloud images disable it)
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?\s*KbdInteractiveAuthentication'
        line: "KbdInteractiveAuthentication yes"
        backup: true
      notify: Restart sshd

    - name: Create directory for the decoy file
      ansible.builtin.file:
        path: "{{ decoy_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Drop sample decoy "passwords" file
      ansible.builtin.copy:
        dest: "{{ decoy_dir }}/{{ decoy_file }}"
        owner: root
        group: root
        mode: "0644"
        content: |
          # sample-data-only — not real credentials
          # generated by Ansible for lab/demo purposes
          admin:Summer2024!
          backup_svc:Passw0rd123
          root:ChangeMeNow!
          db_readonly:letmein2024

  handlers:
    - name: Restart sshd
      ansible.builtin.service:
        name: ssh
        state: restarted
